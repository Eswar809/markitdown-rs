[package]
name = "markitdown-rs"
version = "0.6.0"
edition = "2021"
rust-version = "1.75"
description = "Rust port of microsoft/markitdown — convert documents to Markdown for LLMs"
license = "MIT"

[dependencies]
csv = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
roxmltree = "0.20"
pdf-extract = "0.7"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
