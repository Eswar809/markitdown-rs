name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2.9.2

      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    needs: [fmt]
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2.9.2

      - name: Lint with warnings denied
        run: cargo clippy --all-targets -- -D warnings

  test:
    name: test (debug)
    runs-on: ubuntu-latest
    needs: [clippy]
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2.9.2

      - name: Run unit tests (debug)
        run: cargo test

  test-release:
    name: test (release)
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2.9.2

      - name: Run unit + integration tests (54-case parity in tests/fixtures)
        run: cargo test --release

  parity:
    name: parity (54-case byte-identical)
    runs-on: ubuntu-latest
    needs: [test-release]
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Check out upstream Python baseline (pinned to v0.1.8b1)
        uses: actions/checkout@v7.0.1
        with:
          repository: microsoft/markitdown
          ref: v0.1.8b1
          path: markitdown
          fetch-depth: 1

      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2.9.2

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      - name: Install Python baseline dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install mammoth lxml pandas openpyxl python-pptx "pdfminer.six>=20251230" "pdfplumber>=0.11.9" beautifulsoup4 markdownify charset-normalizer "magika~=0.6.1" defusedxml requests

      - name: Build dump helper (release)
        run: cargo build --release --example dump

      # parity.py was authored on Windows and resolves the helper as
      # dump.exe; the harness itself is untouched, so provide that name.
      - name: Provide dump.exe name expected by parity harness
        run: ln -sf dump target/release/examples/dump.exe

      - name: Run 54-case byte-identical parity suite
        run: python parity.py ./markitdown
